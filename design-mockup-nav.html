<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Homy - Design mockup navigation</title>
<style>
  body { font-family: -apple-system, sans-serif; background: #f1efe8; padding: 20px; }
  .phone { max-width: 380px; margin: 0 auto; background: #f1efe8; border-radius: 20px; padding: 10px; border: 0.5px solid #d3d1c7; }
  .screen { background: #ffffff; border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; height: 640px; }
  .content { flex: 1; overflow: hidden; }
  .header { padding: 16px 16px 12px; border-bottom: 0.5px solid #d3d1c7; display: flex; align-items: center; justify-content: space-between; }
  .header p { margin: 0; }
  .title { font-size: 18px; font-weight: 500; }
  .subtitle { margin-top: 2px; font-size: 12px; color: #888780; }
  .add-btn { width: 34px; height: 34px; padding: 0; border-radius: 50%; background: #2c2c2a; color: #fff; border: none; }
  .day-header { padding: 14px 16px 8px; font-size: 13px; font-weight: 500; color: #5f5e5a; }
  .task-list { padding: 0 16px 6px; }
  .task-card { border: 0.5px solid #d3d1c7; border-radius: 12px; padding: 12px; margin-bottom: 10px; }
  .task-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2px; }
  .task-name { display: flex; align-items: center; gap: 8px; }
  .task-name p { margin: 0; font-size: 14px; font-weight: 500; }
  .task-time { font-size: 12px; color: #888780; }
  .task-sub { margin: 0 0 8px; font-size: 12px; color: #888780; padding-left: 26px; }
  .task-sub.late { color: #A32D2D; }
  .progress-track { height: 5px; border-radius: 3px; background: #f1efe8; overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 3px; }
  .tabbar { border-top: 0.5px solid #d3d1c7; display: flex; padding: 8px 0 10px; background: #fff; }
  .tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; color: #888780; font-size: 11px; }
  .tab.active { color: #185fa5; font-weight: 500; }
</style>
</head>
<body>

<div class="phone">
  <div class="screen">
    <div class="content">

      <div class="header">
        <div>
          <p class="title">Marolleau</p>
          <p class="subtitle">4 membres</p>
        </div>
        <button class="add-btn">+</button>
      </div>

      <div class="day-header">Jeudi 13 août</div>
      <div class="task-list">
        <div class="task-card">
          <div class="task-top">
            <div class="task-name"><p>🧹 Sortir les poubelles</p></div>
            <span class="task-time">18h00</span>
          </div>
          <p class="task-sub">Alex • il reste 1h32</p>
          <div class="progress-track"><div class="progress-fill" style="width:62%;background:linear-gradient(90deg,#639922,#EF9F27);"></div></div>
        </div>

        <div class="task-card">
          <div class="task-top">
            <div class="task-name"><p>🧻 Nettoyer la salle de bain</p></div>
            <span class="task-time">20h30</span>
          </div>
          <p class="task-sub late">Tom • en retard</p>
          <div class="progress-track"><div class="progress-fill" style="width:100%;background:#E24B4A;"></div></div>
        </div>
      </div>

    </div>

    <div class="tabbar">
      <div class="tab active">🏠<span>Accueil</span></div>
      <div class="tab">✅<span>Tâches</span></div>
      <div class="tab">👥<span>Groupe</span></div>
      <div class="tab">👤<span>Profil</span></div>
    </div>
  </div>
</div>

</body>
</html>
